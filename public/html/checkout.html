<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Jewelry Shop</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/checkout.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/html/index.html" class="brand" data-site-name>Jewelry Shop</a>
      <nav class="main-nav">
        <a href="/html/index.html">Home</a>
        <a href="/html/shop.html">Shop All</a>
      </nav>
      <div class="header-actions">
        <a href="/html/cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count>0</span></a>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container checkout-layout">
      <div class="checkout-main">
        <!-- Step 1: shipping/contact details + place order -->
        <div id="details-step">
          <h1>Checkout</h1>
          <form id="checkout-form">
            <h3>Contact</h3>
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" required />
              </div>
            </div>

            <h3>Shipping address</h3>
            <div class="field">
              <label for="address">Address</label>
              <input id="address" name="address" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="city">City</label>
                <input id="city" name="city" required />
              </div>
              <div class="field">
                <label for="state">State</label>
                <input id="state" name="state" required />
              </div>
              <div class="field">
                <label for="postal_code">PIN code</label>
                <input id="postal_code" name="postal_code" required />
              </div>
            </div>
            <div class="field">
              <label for="notes">Order notes (optional)</label>
              <textarea id="notes" name="notes" rows="2"></textarea>
            </div>

            <p class="error-text" id="checkout-error" style="display:none;"></p>
            <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">
              Place order &mdash; pay by QR code next
            </button>
          </form>
        </div>

        <!-- Step 2: shown after the order is created; customer pays via QR then submits a reference -->
        <div id="payment-step" style="display:none;">
          <h1>Scan to pay</h1>
          <p class="helper-text" id="payment-instructions"></p>
          <div class="qr-box">
            <img id="qr-image" src="" alt="Payment QR code" />
            <p class="qr-upi" id="upi-id"></p>
            <p class="qr-amount" id="qr-amount"></p>
          </div>
          <form id="payment-form">
            <div class="field">
              <label for="payment_reference">UPI / bank transaction reference (UTR)</label>
              <input id="payment_reference" name="payment_reference" placeholder="e.g. 402816558211" required />
            </div>
            <p class="error-text" id="payment-error" style="display:none;"></p>
            <button type="submit" class="btn btn-primary btn-block">I've paid — confirm order</button>
          </form>
        </div>
      </div>

      <aside class="checkout-summary" id="checkout-summary"></aside>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <span data-site-name>Jewelry Shop</span>
      <span>Questions? <a data-support-email href="#">hello@example.com</a></span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/cart-store.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/brand.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
