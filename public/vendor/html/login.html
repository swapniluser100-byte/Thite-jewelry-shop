<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Login — Jewelry Shop</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/vendor/css/vendor.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>Vendor Portal</h1>
      <p class="helper-text" style="margin-bottom:20px;">Sign in to manage the product catalog and site settings.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <p class="error-text" id="login-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/js/renewal-gate.js"></script>
  <script src="/vendor/js/vendor-api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      try {
        await window.vendorApi.login(document.getElementById("email").value, document.getElementById("password").value);
        location.href = "/vendor/html/products.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
