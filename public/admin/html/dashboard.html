<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Admin Console</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-sidebar">
      <div class="brand">Admin Console</div>
      <a href="/admin/html/dashboard.html" class="active">Dashboard</a>
      <a href="/admin/html/products.html">Products</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="/admin/html/customers.html">Customers</a>
      <a href="/admin/html/settings.html">Settings</a>
      <a href="#" data-logout class="logout-link">Log out</a>
    </nav>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Dashboard</h1>
        <span class="who">Signed in as <span data-admin-name>…</span></span>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="label">Loading…</div></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h3 style="margin:0;">Recent orders</h3>
          <a href="/admin/html/orders.html" class="helper-text">View all orders &rarr;</a>
        </div>
        <table>
          <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed</th></tr></thead>
          <tbody id="recent-orders-body"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-auth-guard.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
