<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Admin Console</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-sidebar">
      <div class="brand">Admin Console</div>
      <a href="/admin/html/dashboard.html" class="active">Dashboard</a>
      <a href="/admin/html/customers.html">Customers</a>
      <a href="/admin/html/products.html" data-nav-products>Products</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="#" data-logout class="logout-link">Log out</a>
      <a href="https://www.sitepragati.in/raise-request?customerId=asmcDHaHEEktePc" target="_blank" rel="noopener" class="maintenance-link" data-maintenance-link>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Site Maintenance Request
      </a>
      <div class="sidebar-credit">Developed by SitePragati<br /><a href="mailto:support@sitepragati.in">support@sitepragati.in</a></div>
    </nav>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Dashboard Overview</h1>
        <div class="topbar-meta">
          <span class="who">Signed in as <span data-admin-name>…</span></span>
          <span class="who" id="last-updated"></span>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="label">Loading…</div></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h3 style="margin:0;">Recent orders</h3>
          <a href="/admin/html/orders.html" class="helper-text">View all orders &rarr;</a>
        </div>
        <table>
          <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed</th><th></th></tr></thead>
          <tbody id="recent-orders-body"><tr><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/renewal-gate.js"></script>
  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-auth-guard.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
