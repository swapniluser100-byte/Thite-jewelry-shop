<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products — Admin Console</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-sidebar">
      <div class="brand">Admin Console</div>
      <a href="/admin/html/dashboard.html">Dashboard</a>
      <a href="/admin/html/products.html" class="active">Products</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="/admin/html/customers.html">Customers</a>
      <a href="/admin/html/settings.html">Settings</a>
      <a href="#" data-logout class="logout-link">Log out</a>
    </nav>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
        <span class="who">Signed in as <span data-admin-name>…</span></span>
      </div>

      <div class="toolbar">
        <span class="helper-text" id="product-count"></span>
        <a href="/admin/html/product-edit.html" class="btn btn-primary">+ New product</a>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
          <tbody id="products-body"><tr><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-auth-guard.js"></script>
  <script src="/admin/js/products.js"></script>
</body>
</html>
