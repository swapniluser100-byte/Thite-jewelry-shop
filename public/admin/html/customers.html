<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customers — Admin Console</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-sidebar">
      <div class="brand">Admin Console</div>
      <a href="/admin/html/dashboard.html">Dashboard</a>
      <a href="/admin/html/products.html">Products</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="/admin/html/customers.html" class="active">Customers</a>
      <a href="/admin/html/settings.html">Settings</a>
      <a href="#" data-logout class="logout-link">Log out</a>
    </nav>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Customers</h1>
        <span class="who">Signed in as <span data-admin-name>…</span></span>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Lifetime spend</th></tr></thead>
          <tbody id="customers-body"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-auth-guard.js"></script>
  <script src="/admin/js/customers.js"></script>
</body>
</html>
