name = "jewelry-shop"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# D1 database binding. Create it once with:
#   npx wrangler d1 create jewelry_shop_db
# then paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "jewelry_shop_db"
database_id = "f804b190-4922-4667-8496-8ec0a8a9da16"

# ---------------------------------------------------------------------------
# Secrets (set with `npx wrangler pages secret put <NAME>`, not in this file):
#   RESEND_API_KEY   API key from https://resend.com — used to send branded
#                    order confirmation / status-update emails directly from
#                    functions/lib/email.js (no queue, no separate worker).
# ---------------------------------------------------------------------------
