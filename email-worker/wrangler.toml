name = "jewelry-shop-email-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Same D1 database as the main Pages project (../wrangler.toml) — paste the
# same database_id you used there.
[[d1_databases]]
binding = "DB"
database_name = "jewelry_shop_db"
database_id = "9ee17707-1bb3-4754-bbae-5766d6517b49"

# Consumer side of the queue the Pages Functions produce to. max_retries
# controls how many times Cloudflare redelivers a failed message before
# giving up on it; dead_letter_queue is where it lands after that — from
# there you can inspect/redrive it (see README "Email delivery & redrive").
[[queues.consumers]]
queue = "order-events"
max_retries = 5
max_batch_size = 10
max_batch_timeout = 5
dead_letter_queue = "order-events-dlq"

# Second consumer, same worker: messages that exhausted their retries land
# here instead of vanishing. We record them (status = dead_letter) in
# email_log so they're visible in the Admin Console, instead of retrying
# forever. See README "Email delivery & redrive" for how to redrive them
# once you've fixed whatever made them fail (e.g. a bad API key).
[[queues.consumers]]
queue = "order-events-dlq"
max_retries = 1
max_batch_size = 10

# ---------------------------------------------------------------------------
# Secrets (set with `wrangler secret put <NAME>` from inside email-worker/):
#   RESEND_API_KEY   API key from https://resend.com
# ---------------------------------------------------------------------------
